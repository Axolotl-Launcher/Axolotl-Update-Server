# Based on the deployed OpenResty configuration. Include in http {}.
# Requires ngx_http_realip_module: $realip_remote_addr preserves the TCP peer
# even if real_ip rewrites $remote_addr. Without that module, disable real_ip
# rewriting and replace $realip_remote_addr below with $remote_addr.
server {
    listen 80;
    server_name update.axlmc.org update.origins.axlmc.org;

    location / {
        return 301 https://update.axlmc.org$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    server_name update.axlmc.org update.origins.axlmc.org;

    ssl_certificate     /etc/letsencrypt/live/update.axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/update.axlmc.org;
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 1800s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /latest {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 1800s;
        # Preserve Cache-Control, Cloudflare-CDN-Cache-Control and Vary.
    }

    location ^~ /dist/ {
        # Do not use root/alias/try_files: Go enforces Cloudflare access.
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never trust an arbitrary client's incoming XFF.
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Axolotl-Origin-Secret $http_x_axolotl_origin_secret;
        proxy_read_timeout 1800s;
        proxy_redirect off;
        proxy_cache off;
        # Stream packages without additional proxy temporary files/compression.
        proxy_buffering off;
        gzip off;
        # Preserve application cache headers, Content-Length, ETag and Range.
    }

    location / {
        return 404;
    }
}

