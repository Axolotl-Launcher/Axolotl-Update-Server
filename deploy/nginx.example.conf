# Include in http {}. Use the actual certificate and hostnames for deployment.
server {
    listen 443 ssl;
    server_name update.axlmc.org update.origins.axlmc.org;
    ssl_certificate /etc/letsencrypt/live/update.axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512m;

    # $remote_addr must remain the immediate peer for application trust checks.
    # Account for any nginx real_ip module configuration in your deployment.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 1800s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location = /latest {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 1800s;
        # Preserve Cache-Control, Cloudflare-CDN-Cache-Control and Vary.
    }
    location ^~ /dist/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_redirect off;
        proxy_cache off;
    }
    location / { return 404; }
}

