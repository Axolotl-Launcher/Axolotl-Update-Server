# Additional site alongside nginx.example.conf; same Go process and DIST_ROOT.
# Certificate must cover dist.axlmc.org. Adjust paths to your certificate.
# Requires ngx_http_realip_module as in the existing update site.
server {
    listen 80;
    server_name dist.axlmc.org;
    return 301 https://dist.axlmc.org$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dist.axlmc.org;

    ssl_certificate     /etc/letsencrypt/live/dist.axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dist.axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /dist/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Axolotl-Origin-Secret $http_x_axolotl_origin_secret;
        proxy_read_timeout 1800s;
        proxy_redirect off;
        proxy_cache off;
        proxy_buffering off;
        gzip off;
        # Preserve application cache headers, ETag, Content-Length and Range.
        # Do not serve through root/alias: this would bypass Cloudflare checks.
    }

    # This hostname exposes distribution only; APIs remain on update.axlmc.org.
    location / { return 404; }
}
