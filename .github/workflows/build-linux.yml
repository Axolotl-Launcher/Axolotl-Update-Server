name: Build Linux amd64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux amd64 binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: '1'
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CC: musl-gcc
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install static C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools file

      - name: Verify modules
        run: go mod verify

      - name: Build static executable
        run: |
          mkdir -p artifacts
          go build -mod=readonly -trimpath -tags 'netgo osusergo' \
            -ldflags '-s -w -linkmode external -extldflags "-static"' \
            -o artifacts/axolotl-server ./cmd/axolotl-server

      - name: Verify executable
        run: |
          file artifacts/axolotl-server
          file artifacts/axolotl-server | grep -q 'statically linked'
          ./artifacts/axolotl-server --help

      - name: Package executable and checksums
        working-directory: artifacts
        run: |
          tar -czf axolotl-server-linux-amd64.tar.gz axolotl-server
          sha256sum axolotl-server axolotl-server-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload Linux amd64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: axolotl-server-linux-amd64
          path: |
            artifacts/axolotl-server
            artifacts/axolotl-server-linux-amd64.tar.gz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
