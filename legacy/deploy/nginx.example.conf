# Include from Nginx's http context. Certificate must cover both HTTPS names.
# HTTP/3 directives below match the existing deployment's QUIC-capable build.
server {
    listen 80;
    server_name update.axlmc.org update.origins.axlmc.org;

    location / {
        return 301 https://update.axlmc.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;

    server_name update.axlmc.org update.origins.axlmc.org;

    ssl_certificate     /etc/letsencrypt/live/update.axlmc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/update.axlmc.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /www/wwwroot/update.axlmc.org;
    client_max_body_size 512m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /latest {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
    }

    location ^~ /dist/ {
        # No try_files/static handler: DIST_SERVER must override ALL local files.
        # No URI suffix on proxy_pass: preserve /dist/<version>/<asset> and query.
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;
        proxy_redirect off;
        proxy_cache off;
    }

    location / {
        return 404;
    }
}
